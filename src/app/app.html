<!-- ============================================================
     APP.HTML: acá se integran los componentes de cada alumno
     ============================================================
     Lo mantiene el líder técnico. Cuando se mergea un pull request,
     se reemplaza el cartel "Pendiente" por la etiqueta del componente. -->

<header class="barra">
  <h1>💈 La Navaja Alegre</h1>
  <p>Turnos de la barbería</p>
</header>

<main class="contenido">
  <section>
    <!-- PENDIENTE · resumen:
         <app-resumen [turnos]="turnos" /> -->
    <p class="pendiente">Pendiente: resumen ({{ turnos.length }} turnos cargados)</p>

    <!-- PENDIENTE · lista-turnos (usa turno-item adentro):
         <app-lista-turnos
           [turnos]="turnos"
           (atender)="atender($event)"
           (cancelar)="cancelar($event)"
           (eliminar)="eliminar($event)"
           (editar)="empezarEdicion($event)" /> -->
    <p class="pendiente">Pendiente: lista de turnos</p>
  </section>

<aside>
  @if (turnoEnEdicion) {
    <!-- PENDIENTE · editar-turno -->
    ...
  } @else {
    <app-turno-form (agregar)="agregar($event)"></app-turno-form>
  }
</aside>
</main>
