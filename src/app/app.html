<!-- ============================================================
     APP.HTML: acá se integran los componentes de cada alumno
     ============================================================
     Lo mantiene el líder técnico. Cuando se mergea un pull request,
     se reemplaza el cartel "Pendiente" por la etiqueta del componente.
     Los componentes ya no reciben la lista ni avisan con outputs:
     usan TurnosService directamente. -->

<header class="barra">
  <h1>💈 La Navaja Alegre</h1>
  <p>Turnos de la barbería</p>
</header>

<main class="contenido">
  <section>
    <!-- PENDIENTE · resumen:
         <app-resumen /> -->
    <p class="pendiente">Pendiente: resumen ({{ turnosService.turnos.length }} turnos cargados)</p>

    <!-- PENDIENTE · lista-turnos (usa turno-item adentro):
         <app-lista-turnos /> -->
    <p class="pendiente">Pendiente: lista de turnos</p>
  </section>

<aside>
  @if (turnosService.turnoEnEdicion) {
    <!-- PENDIENTE · editar-turno:
         <app-editar-turno [turno]="turnosService.turnoEnEdicion" /> -->
    ...
  } @else {
    <app-turno-form />
  }
</aside>
</main>
