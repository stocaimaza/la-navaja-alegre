<form #formulario="ngForm" (ngSubmit)="onGuardar()">
  <h3>Editar turno</h3>

  <div class="campo">
    <label for="cliente">Cliente</label>
    <input
      id="cliente"
      name="cliente"
      type="text"
      [(ngModel)]="copia.cliente"
      #cliente="ngModel"
      required
      minlength="3"
    />
    @if (cliente.touched && cliente.errors?.['required']) {
      <small class="error">El cliente es obligatorio.</small>
    }
    @if (cliente.touched && cliente.errors?.['minlength']) {
      <small class="error">El cliente debe tener al menos 3 letras.</small>
    }
  </div>

  <div class="campo">
    <label for="hora">Hora</label>
    <input
      id="hora"
      name="hora"
      type="time"
      [(ngModel)]="copia.hora"
      #hora="ngModel"
      required
    />
    @if (hora.touched && hora.errors?.['required']) {
      <small class="error">La hora es obligatoria.</small>
    }
  </div>

  <div class="botones">
    <button type="submit" [disabled]="formulario.invalid">Guardar</button>
    <button type="button" (click)="onDescartar()">Descartar</button>
  </div>
</form>
